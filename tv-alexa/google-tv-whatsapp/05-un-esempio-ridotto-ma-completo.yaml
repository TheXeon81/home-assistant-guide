# Comandare la Google TV da WhatsApp con Home Assistant
# Sezione / Section: Un esempio ridotto ma completo
# Guida completa (in italiano) / Full guide (in Italian):
# https://www.lucianoblancato.it/home-assistant/home-assistant-google-tv-whatsapp.html

- conditions: "{{ (testo | string | lower | trim).split(' ')[0] == 'tv' }}"
  sequence:
    - if: "{{ not permesso_tv }}"
      then:
        - action: script.whatsapp_rispondi
          data:
            chat: "{{ chat }}"
            testo: "*🔒 COMANDO NON DISPONIBILE*\n━━━━━━━━━━━━━━\nIl tuo profilo non comprende i comandi della TV."
      else:
        - action: script.turn_on
          target:
            entity_id: script.tv_comando
          data:
            variables:
              testo: "{{ testo }}"
              chat: "{{ chat }}"
