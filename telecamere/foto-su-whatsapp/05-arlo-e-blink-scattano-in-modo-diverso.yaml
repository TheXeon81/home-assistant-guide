# Telecamere su WhatsApp con Home Assistant: foto negli avvisi e scatti a richiesta
# Sezione / Section: Arlo e Blink scattano in modo diverso
# Guida completa (in italiano) / Full guide (in Italian):
# https://www.lucianoblancato.it/home-assistant/home-assistant-telecamere-whatsapp-foto.html

- action: blink.trigger_camera
  target:
    entity_id: camera.caldaia
- delay: "00:00:06"
- action: homeassistant.update_entity
  target:
    entity_id: camera.caldaia
- action: camera.snapshot
  target:
    entity_id: camera.caldaia
  data:
    filename: /media/richiesta_caldaia.jpg
