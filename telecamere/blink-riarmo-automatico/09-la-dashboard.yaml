# Blink sempre armato: riarmo automatico, comandi WhatsApp e avvisi con Home Assistant
# Sezione / Section: La dashboard
# Guida completa (in italiano) / Full guide (in Italian):
# https://www.lucianoblancato.it/home-assistant/home-assistant-blink-riarmo-automatico-whatsapp.html

type: entities
title: 📹 Blink
entities:
  - entity: alarm_control_panel.blink_casa
    name: Stato
  - type: attribute
    entity: alarm_control_panel.blink_casa
    attribute: status
    name: Modulo CASA
  - entity: input_boolean.blink_riarmo_auto
    name: Riarmo automatico
  - type: conditional
    conditions:
      - entity: input_boolean.blink_riarmo_auto
        state: "on"
    row:
      entity: input_number.blink_riarmo_minuti
      name: Riarma dopo (minuti)
  - entity: sensor.blink_prossimo_riarmo
    name: Prossimo riarmo
    format: time
  - type: conditional
    conditions:
      - entity: input_boolean.blink_errore_in_corso
        state: "on"
    row:
      entity: input_text.blink_ultimo_errore
      name: Ultimo errore
  - type: button
    name: Arma adesso
    icon: mdi:shield-lock
    action_name: ARMA
    tap_action:
      action: perform-action
      perform_action: script.blink_arma
