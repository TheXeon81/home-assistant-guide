# Notifiche WhatsApp da Home Assistant: da una riga di testo a messaggi veri
# Sezione / Section: Un impaginatore solo
# Guida completa (in italiano) / Full guide (in Italian):
# https://www.lucianoblancato.it/home-assistant/home-assistant-notifiche-whatsapp-formattate.html

testo_wa: >-
  {{ icona }} *{{ titolo | upper }}*
  {{- '\n' }}━━━━━━━━━━━━━━
  {{- '\n' }}{{ messaggio }}
  {%- for r in righe %}{{ '\n' }}{{ r }}{% endfor %}
  {%- if nota is defined and nota %}{{ '\n\n' }}👉 _{{ nota }}_{% endif %}
  {{- '\n\n' }}🕒 {{ now().strftime('%d/%m · %H:%M') }}
